name: Smoke Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: thekedaar
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d thekedaar"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thekedaar
      DB_SSL: "false"
      JWT_SECRET: ci-test-secret
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend

      - name: Frontend production build
        run: npm run build

      - name: Backend migrations
        run: npm --prefix backend run migrate:all

      - name: Backend unit tests
        run: npm test --prefix backend

      - name: Start backend
        run: npm --prefix backend run dev &

      - name: Wait for backend
        run: |
          n=0
          until [ $n -ge 30 ]
          do
            if curl -sS http://localhost:5000/health >/dev/null 2>&1; then
              echo "backend up"
              break
            fi
            n=$((n+1))
            sleep 1
          done

      - name: Run smoke tests
        run: bash ./scripts/smoke-test.sh
